<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420" width="550" height="420" fill="none">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F2A20" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="530" height="400" rx="20" fill="url(#mapBg)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5"/>

  <!-- Radar Grid Circles -->
  <circle cx="280" cy="210" r="140" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="280" cy="210" r="90" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="280" cy="210" r="40" stroke="rgba(212, 175, 55, 0.15)" stroke-width="1"/>

  <!-- Connection Routes Between Cities -->
  <path d="M 280 100 L 260 170 L 300 200 L 320 230 L 280 320" stroke="url(#goldAccent)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <path d="M 260 170 L 220 180" stroke="url(#goldAccent)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Jubail Node -->
  <g transform="translate(280, 100)">
    <circle cx="0" cy="0" r="12" fill="rgba(212, 175, 55, 0.2)"/>
    <circle cx="0" cy="0" r="6" fill="#D4AF37" filter="url(#glow)"/>
    <text x="18" y="5" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">الجبيل</text>
    <text x="18" y="20" fill="#9AE6B4" font-family="system-ui, sans-serif" font-size="10">تغطية صناعية وسكنية</text>
  </g>

  <!-- Qatif Node -->
  <g transform="translate(220, 180)">
    <circle cx="0" cy="0" r="12" fill="rgba(212, 175, 55, 0.2)"/>
    <circle cx="0" cy="0" r="6" fill="#D4AF37"/>
    <text x="-16" y="5" text-anchor="end" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">القطيف</text>
    <text x="-16" y="20" text-anchor="end" fill="#9AE6B4" font-family="system-ui, sans-serif" font-size="10">سيهات وتاروت وعنك</text>
  </g>

  <!-- Dammam Node (Center Hub) -->
  <g transform="translate(260, 170)">
    <circle cx="0" cy="0" r="18" fill="rgba(37, 211, 102, 0.2)"/>
    <circle cx="0" cy="0" r="8" fill="#25D366" filter="url(#glow)"/>
    <text x="18" y="4" fill="#FFE082" font-family="system-ui, sans-serif" font-size="16" font-weight="900">الدمام (المقر الرئيسي)</text>
    <text x="18" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">جاهزية خلال 30 دقيقة</text>
  </g>

  <!-- Dhahran Node -->
  <g transform="translate(300, 200)">
    <circle cx="0" cy="0" r="12" fill="rgba(212, 175, 55, 0.2)"/>
    <circle cx="0" cy="0" r="6" fill="#D4AF37"/>
    <text x="18" y="5" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">الظهران</text>
    <text x="18" y="20" fill="#9AE6B4" font-family="system-ui, sans-serif" font-size="10">الدوحة والجامعة والربوة</text>
  </g>

  <!-- Khobar Node -->
  <g transform="translate(320, 230)">
    <circle cx="0" cy="0" r="14" fill="rgba(212, 175, 55, 0.2)"/>
    <circle cx="0" cy="0" r="7" fill="#D4AF37" filter="url(#glow)"/>
    <text x="18" y="5" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">الخبر</text>
    <text x="18" y="20" fill="#9AE6B4" font-family="system-ui, sans-serif" font-size="10">العزيزية والحزام والكورنيش</text>
  </g>

  <!-- Al Ahsa Node -->
  <g transform="translate(280, 320)">
    <circle cx="0" cy="0" r="14" fill="rgba(212, 175, 55, 0.2)"/>
    <circle cx="0" cy="0" r="7" fill="#D4AF37" filter="url(#glow)"/>
    <text x="18" y="5" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">الأحساء</text>
    <text x="18" y="20" fill="#9AE6B4" font-family="system-ui, sans-serif" font-size="10">الهفوف والمبرز والعيون</text>
  </g>

  <!-- Badge / Fleet Indicator -->
  <g transform="translate(30, 350)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(212, 175, 55, 0.3)"/>
    <circle cx="20" cy="20" r="6" fill="#25D366"/>
    <text x="35" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">أسطول متمركز بالمنطقة</text>
  </g>
</svg>
